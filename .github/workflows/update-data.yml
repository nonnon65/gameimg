name: 게임 이미지 데이터 자동 갱신

on:
  push:
    branches:
      - claude/game-gallery-site-c6jLY
      - main
    paths-ignore:
      - 'data/images.json'   # 데이터 갱신 커밋이 재귀 실행되지 않도록
  schedule:
    # 매일 오전 9시 (KST) = UTC 00:00
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 수동 실행 허용 (GitHub Actions 탭에서 "Run workflow" 클릭)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 이미지 데이터 갱신
        run: python scripts/update_data.py

      - name: 변경 사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/images.json
          if git diff --staged --quiet; then
            echo "새 이미지 없음 - 커밋 건너뜀"
          else
            ADDED=$(git diff --staged --name-only | xargs -I{} git diff --staged -- {} | grep '^+' | grep -c '"id"' || true)
            git commit -m "data: 이미지 데이터 갱신 $(date -u +'%Y-%m-%d') (+${ADDED}개)"
            git push
          fi
